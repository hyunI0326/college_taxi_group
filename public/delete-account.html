<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>대택구 계정 삭제</title><style>body{font:16px/1.7 system-ui,sans-serif;max-width:620px;margin:0 auto;padding:24px;color:#263129}h1{line-height:1.3}a{color:#176345}label{display:block;margin:18px 0 6px;font-weight:700}input:not([type=checkbox]){box-sizing:border-box;width:100%;padding:12px;font:inherit;border:1px solid #aab5ad;border-radius:10px}button{margin-top:20px;padding:13px 20px;border:0;border-radius:10px;background:#176345;color:white;font:700 16px system-ui;cursor:pointer}button:disabled{opacity:.6}#result{min-height:1.5em}</style></head><body>
<a href="/">← 대택구</a><h1>대택구 계정 삭제</h1><p>앱이 없어도 이 페이지에서 삭제할 수 있습니다. 아이디와 비밀번호로 본인을 확인한 뒤 계정·프로필·세션·본인 채팅·신고·차단 정보를 삭제합니다. 파티에 다른 참여자가 있으면 파티는 유지되며, 이미 정산된 파티의 익명 참여 기록은 출발 7일이 지난 뒤 정기 정리됩니다.</p>
<form id="delete-form"><label for="login-id">아이디</label><input id="login-id" autocomplete="username" pattern="[a-zA-Z0-9_]{4,24}" required><label for="password">비밀번호</label><input id="password" type="password" autocomplete="current-password" required><label><input id="understood" type="checkbox" required> 계정과 관련 정보가 영구 삭제됨을 확인했습니다.</label><button type="submit">계정 영구 삭제</button></form><p id="result" role="status" aria-live="polite"></p><p>로그인 정보를 잊었거나 삭제 과정에 문제가 있으면 <a href="mailto:hyunhyun0326@gmail.com?subject=%ED%83%9D%EC%8B%9C%ED%8C%9F%20%EA%B3%84%EC%A0%95%20%EC%82%AD%EC%A0%9C%20%EC%9A%94%EC%B2%AD">hyunhyun0326@gmail.com</a>으로 계정 삭제를 요청하세요. 본인 확인 후 처리합니다.</p>
<script>document.getElementById('delete-form').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget,button=form.querySelector('button'),result=document.getElementById('result');button.disabled=true;result.textContent='삭제 중입니다…';try{const response=await fetch('/api/account',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({loginId:document.getElementById('login-id').value,password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw Error(data.error||'삭제에 실패했습니다.');form.remove();result.textContent='계정이 삭제되었습니다.'}catch(error){result.textContent=error.message;button.disabled=false}});</script>
</body></html>
